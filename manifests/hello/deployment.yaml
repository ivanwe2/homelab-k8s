apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  labels:
    app: hello
spec:
  replicas: 4
  selector:
    matchLabels:
      app: hello            # which pods this Deployment owns
  template:                 # the pod blueprint
    metadata:
      labels:
        app: hello          # must match the selector above
      annotations:
        lab: "b3"
    spec:
      topologySpreadConstraints:
        - maxSkew: 1                          # per-node counts may differ by at most 1
          topologyKey: kubernetes.io/hostname # one domain per node
          whenUnsatisfiable: DoNotSchedule    # strict: rather Pending than unbalanced
          nodeTaintsPolicy: Honor             # ignore nodes this pod can't use (cordoned, dead)
          labelSelector:
            matchLabels:
              app: hello                      # which pods to count
          matchLabelKeys:
            - pod-template-hash               # count only pods of the same revision
      containers:
        - name: nginx
          image: nginx:stable-alpine
          env:
            - name: SECRET_MESSAGE
              valueFrom:
                secretKeyRef:
                  name: hello-secret
                  key: message
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: hello-html