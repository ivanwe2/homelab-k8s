apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik           # must match the name of k3s's HelmChart
  namespace: kube-system  # and live where it lives
spec:
  valuesContent: |-
    deployment:
      replicas: 2
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
    podDisruptionBudget:
      enabled: true
      minAvailable: 1