apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: glance
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - glance.homelab.internal
      secretName: glance-tls
  rules:
    - host: glance.homelab.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: glance
                port:
                  number: 8080