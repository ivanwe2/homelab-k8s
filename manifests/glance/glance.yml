server:
  port: 8080

pages:
  - name: Homelab Command Center
    columns:
      # COLUMN 1: Infrastructure
      - size: small
        widgets:
          - type: bookmarks
            groups:
              - title: Core Infrastructure
                links:
                  - title: Proxmox VE
                    url: https://192.168.0.27:8006
                    icon: si:proxmox
              - title: Workspace Nodes
                links:
                  - title: Ubuntu Dev VM
                    url: http://192.168.0.29
                    icon: si:ubuntu
                  - title: Windows VM
                    url: http://192.168.0.28
                    icon: mdi:microsoft-windows
              - title: Cluster
                links:
                  - title: Argo CD
                    url: https://argocd.homelab.internal
                    icon: si:argo
                  - title: Grafana
                    url: https://grafana.homelab.internal
                    icon: si:grafana
                  - title: Nextcloud
                    url: https://nextcloud.homelab.internal
                    icon: si:nextcloud
                  - title: Hello
                    url: https://hello.homelab.internal
                    icon: mdi:hand-wave

      # COLUMN 2: Cluster health + Local AI
      - size: full
        widgets:
          - type: monitor
            cache: 30s
            title: Cluster health
            sites:
              - title: Argo CD
                url: https://argocd.homelab.internal
                check-url: http://argocd-server.argocd.svc.cluster.local
                icon: si:argo
              - title: Grafana
                url: https://grafana.homelab.internal
                check-url: http://monitoring-grafana.monitoring.svc.cluster.local
                icon: si:grafana
              - title: Prometheus
                url: https://grafana.homelab.internal/explore
                check-url: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090/-/ready
                icon: si:prometheus
              - title: Nextcloud
                url: https://nextcloud.homelab.internal
                check-url: http://nextcloud.nextcloud.svc.cluster.local:8080/status.php
                alt-status-codes:
                  - 400
                icon: si:nextcloud
              - title: Hello
                url: https://hello.homelab.internal
                check-url: http://hello.hello.svc.cluster.local:8080
                icon: mdi:hand-wave
          - type: bookmarks
            groups:
              - title: Local AI Services
                links:
                  - title: Open WebUI + Ollama
                    url: http://192.168.0.70:8080
                    icon: mdi:robot
                  - title: Llama.cpp backend
                    url: http://192.168.0.71:9876
                    icon: mdi:server
                  - title: Hermes Agent
                    url: http://192.168.0.28:8000
                    icon: mdi:head-cog

      # COLUMN 3: Time
      - size: small
        widgets:
          - type: clock
            hour-format: 24h
          - type: calendar