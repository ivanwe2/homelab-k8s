apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextcloud
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://nextcloud.github.io/helm/
    chart: nextcloud
    targetRevision: 9.4.1
      releaseName: nextcloud
      valuesObject:
        nextcloud:
          host: nextcloud.homelab.internal
          existingSecret:
            enabled: true
            secretName: nextcloud-admin   # nextcloud-username / nextcloud-password (C1)
          extraEnv:
            - name: OVERWRITEPROTOCOL      # Traefik terminates TLS: tell Nextcloud the outside is https
              value: https
            - name: OVERWRITECLIURL
              value: https://nextcloud.homelab.internal
            - name: TRUSTED_PROXIES        # trust X-Forwarded-* headers from Traefik's pods
              value: 10.42.0.0/16

        internalDatabase:
          enabled: false                  # no SQLite
        externalDatabase:
          enabled: true
          type: postgresql
          host: nextcloud-db-rw           # always the current primary
          database: nextcloud
          existingSecret:
            enabled: true
            secretName: nextcloud-db-app  # generated by CloudNativePG
            usernameKey: username
            passwordKey: password

        externalRedis:
          enabled: true
          host: valkey
          port: "6379"
          existingSecret:
            enabled: true
            secretName: valkey-auth
            passwordKey: redis-password

        # Bitnami subcharts stay off (the chart's defaults are off, stated here so nobody flips them)
        mariadb:
          enabled: false
        postgresql:
          enabled: false
        redis:
          enabled: false

        cronjob:
          enabled: true                   # background jobs every 5 minutes, in a sidecar container

        persistence:
          enabled: true
          storageClass: local-path
          size: 20Gi                      # not enforced by local-path; the real limit is the node's disk

        ingress:
          enabled: true
          className: traefik
          annotations:
            cert-manager.io/cluster-issuer: homelab-ca
          tls:
            - secretName: nextcloud-tls
              hosts:
                - nextcloud.homelab.internal

        startupProbe:
          enabled: true                   # first start installs Nextcloud: give it up to 5 minutes
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: nextcloud
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
      refresh: true
    syncOptions:
      - CreateNamespace=true