apiVersion: v1
kind: Pod
metadata:
  name: restic-shell
  namespace: nextcloud
spec:
  restartPolicy: Never
  containers:
    - name: restic
      image: restic/restic:0.19.1
      command: ["sleep", "3600"]      # stays up for an hour; delete it when done
      env:
        - name: RESTIC_REPOSITORY
          value: s3:http://192.168.0.40:9000/homelab-backups/nextcloud-files
      envFrom:
        - secretRef:
            name: backup-credentials